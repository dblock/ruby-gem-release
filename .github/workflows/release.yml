name: Release Gem

on:
  workflow_call:
    inputs:
      version:
        description: Optional release version overriding the checked-in version in the standard workflow.
        type: string
      gemspec:
        description: Optional gemspec path; defaults to the only root gemspec.
        type: string
      rubygems-owner:
        description: Optional RubyGems account ID for first publication with a pending trusted publisher.
        type: string
      git-user-name:
        description: Author name for release and next development iteration commits.
        type: string
        default: github-actions[bot]
      git-user-email:
        description: Author email for release and next development iteration commits.
        type: string
        default: github-actions[bot]@users.noreply.github.com
      ruby-version:
        description: Ruby version used to validate and build.
        type: string
        required: true
      timezone:
        description: Timezone for release dates and Git timestamps.
        type: string
        default: UTC
      prepare:
        description: Command to prepare release files; INPUT_VERSION is the selected release version.
        type: string
        default: bundle exec rake release:before_release
      validate:
        description: Command to validate the prepared release.
        type: string
        default: bundle exec rake
      publish:
        description: Command to commit, build, tag, and publish the release.
        type: string
        default: bundle exec rake release:publish
      bump:
        description: Command to prepare, commit, and push the next development iteration.
        type: string
        default: bundle exec rake release:after_release
      success:
        description: Command to run after the release and next development iteration succeed.
        type: string
        default: bundle exec rake release:success
      failure:
        description: Command to run after a release job failure.
        type: string
        default: bundle exec rake release:failure

concurrency:
  group: ruby-gem-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_GEMSPEC: ${{ inputs.gemspec }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GIT_USER_NAME: ${{ inputs.git-user-name }}
      GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      RUBYGEMS_OWNER: ${{ inputs.rubygems-owner }}
      TZ: ${{ inputs.timezone }}
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        id: setup_ruby
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true
      - name: Enable Release Failure Callback
        id: enable_failure_callback
        run: |
          rm -f "$RUNNER_TEMP/ruby-gem-release-failure.json"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Capture Release Context
        id: capture_release_context
        run: bundle exec rake release:workflow:capture
      - name: Prepare Release
        id: prepare_release
        env:
          COMMAND: ${{ inputs.prepare }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Resolve Prepared Version
        id: resolve_prepared_version
        run: bundle exec rake release:workflow:resolve
      - name: Validate Release
        id: validate_release
        env:
          COMMAND: ${{ inputs.validate }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Authenticate to RubyGems
        id: authenticate_rubygems
        if: ${{ inputs.rubygems-owner == '' }}
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Authenticate Pending Publisher
        id: authenticate_pending_publisher
        if: ${{ inputs.rubygems-owner != '' }}
        run: bundle exec rake release:workflow:credentials
      - name: Publish Release
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ inputs.publish }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Preserve Release Artifacts
        id: preserve_release_artifacts
        if: ${{ always() && env.RELEASE_VERSION != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-gem-${{ env.RELEASE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release.gem
            ${{ runner.temp }}/release.json
            ${{ runner.temp }}/release.bundle
          if-no-files-found: warn
          retention-days: 30
      - name: Prepare Next Development Iteration
        id: prepare_next_development_iteration
        env:
          COMMAND: ${{ inputs.bump }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Run Release Success Callback
        id: release_success_callback
        if: success()
        env:
          COMMAND: ${{ inputs.success }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Determine Release Failure Phase
        if: ${{ failure() && steps.enable_failure_callback.outcome == 'success' }}
        env:
          RELEASE_STEPS: ${{ toJSON(steps) }}
        run: bundle exec rake release:workflow:failure_phase
      - name: Run Release Failure Callback
        if: ${{ failure() && steps.enable_failure_callback.outcome == 'success' }}
        env:
          COMMAND: ${{ inputs.failure }}
        run: bash -euo pipefail -c "$COMMAND"
