name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '3.3' }
          - { ruby: '4.0' }
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
      with:
        ruby-version: ${{ matrix.entry.ruby }}
        bundler-cache: true
    - name: Test with Release Context
      run: bundle exec rake spec:unit
      env:
        GEMSPEC_PATH: ${{ github.workspace }}/ruby-gem-release.gemspec
        RELEASE_DATA_DIR: ${{ runner.temp }}
        RELEASE_AUTH_MODE: rubygems
    - name: Send Coverage to Coveralls
      if: matrix.entry.ruby == '4.0'
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: coverage/lcov.info
