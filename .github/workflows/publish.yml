name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Exercise the release without publishing or pushing
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      ruby-version: '4.0'
      dry-run: ${{ inputs.dry-run }}
