name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version overriding the checked-in version.
        type: string
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      ruby-version: '4.0'
      version: ${{ inputs.version }}
      timezone: America/New_York
      rubygems-owner: ${{ vars.RUBYGEMS_OWNER_ID }}
