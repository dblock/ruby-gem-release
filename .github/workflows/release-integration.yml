name: Release Integration

on:
  pull_request:

permissions:
  contents: read

jobs:
  current-version:
    uses: ./.github/workflows/release.yml
    with:
      ruby-version: '3.3'
      dry-run: true
  consumer:
    uses: ./.github/workflows/release.yml
    with:
      version: '9000.0.1'
      gemspec: spec/fixtures/release_consumer/fixture.gemspec
      ruby-version: '3.3'
      prepare: |
        bundle exec rake "release:before_release[$RELEASE_VERSION]" "release:version:set[$RELEASE_VERSION]"
        ruby - <<'RUBY'
        path = 'spec/fixtures/release_consumer/version.rb'
        content = File.read(path)
        File.write(path, content.sub('9000.0.0', ENV.fetch('RELEASE_VERSION')))
        RUBY
        grep -q '^## 9000.0.1 (' CHANGELOG.md
      bump: |
        bundle exec rake release:version:bump "release:after_bump[$RELEASE_VERSION]"
        grep -q '^## 9000.0.2 (Next)$' CHANGELOG.md
      dry-run: true
