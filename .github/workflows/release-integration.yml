name: Release Integration

on:
  pull_request:

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        entry:
          - { ruby: '3.3' }
          - { ruby: '4.0' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - name: Build and Install Release Gem
        run: |
          bundle exec rake build
          version=$(ruby -Ilib -rruby-gem-release/version -e 'print RubyGemRelease::VERSION')
          gem install "pkg/ruby-gem-release-$version.gem" --install-dir "$RUNNER_TEMP/gems" --ignore-dependencies --no-document
          printf "source 'https://rubygems.org'\ngem 'ruby-gem-release', '= %s'\n" "$version" > "$RUNNER_TEMP/Gemfile"
          gem_path="$RUNNER_TEMP/gems:$(bundle exec ruby -e 'print Bundler.bundle_path'):$(ruby -e 'print Gem.path.join(File::PATH_SEPARATOR)')"
          BUNDLE_GEMFILE="$RUNNER_TEMP/Gemfile" GEM_HOME="$RUNNER_TEMP/gems" GEM_PATH="$gem_path" bundle lock --local
          {
            echo "RELEASE_CONSUMER_GEMFILE=$RUNNER_TEMP/Gemfile"
            echo "RELEASE_CONSUMER_GEM_HOME=$RUNNER_TEMP/gems"
            echo "RELEASE_CONSUMER_GEM_PATH=$gem_path"
            echo "RELEASE_CONSUMER_LIB=$RUNNER_TEMP/gems/gems/ruby-gem-release-$version/lib"
          } >> "$GITHUB_ENV"
      - name: Exercise Installed Release Lifecycle
        run: bundle exec rake spec:integration
