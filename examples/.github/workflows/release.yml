name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version (defaults to the current version)
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: dblock/ruby-gem-release/.github/workflows/release.yml@master
    with:
      version: ${{ inputs.version }}
      ruby-version: '3.3'
