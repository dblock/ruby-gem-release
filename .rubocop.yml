inherit_from: .rubocop_todo.yml

inherit_mode:
  merge:
    - Include

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Include:
    - '**/*.yml'
    - '**/*.yaml'
    - '.github/**/*.yml'
    - '.github/**/*.yaml'
    - 'examples/.github/**/*.yml'
    - 'examples/.github/**/*.yaml'
    - '.rubocop.yml'
  Exclude:
    - 'vendor/**/*'
    - 'bin/**/*'

plugins:
  - rubocop-md
  - rubocop-prose
  - rubocop-rake
  - rubocop-rspec
  - rubocop-spellcheck
  - rubocop-yaml

# The YAML cops otherwise run on Ruby files and skip hidden workflow paths.
YAML/Lint/InvalidSyntax:
  Include:
    - '**/*.yml'
    - '**/*.yaml'
    - '.github/**/*.yml'
    - '.github/**/*.yaml'
    - 'examples/.github/**/*.yml'
    - 'examples/.github/**/*.yaml'
    - '.rubocop.yml'

YAML/Lint/DuplicateKey:
  Include:
    - '**/*.yml'
    - '**/*.yaml'
    - '.github/**/*.yml'
    - '.github/**/*.yaml'
    - 'examples/.github/**/*.yml'
    - 'examples/.github/**/*.yaml'
    - '.rubocop.yml'

Spellcheck:
  DictionaryFiles:
    en:
    - gem:rubocop-spellcheck/data/en/en.dic
    - ".spellcheck.txt"
Spellcheck/Spelling:
  Exclude:
    - LICENSE.txt
  Ruby:
    Strings: false

Prose/MaxLength:
  Exclude:
    - LICENSE.txt

Markdown/HeadingCapitalization:
  Enabled: true
  Style: title_case

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Enabled: false

Naming/FileName:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

RSpec/DescribeClass:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

Style/HashExcept:
  Enabled: false

Gemspec/RequiredRubyVersion:
  Enabled: false
